<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igor Carvalho — Notas de Engenharia</title>
<meta name="description" content="Notas de engenharia sobre software e IA — artigos técnicos carregados sob demanda, zero build, GitHub Pages.">

<script>
  // Anti-flash: aplica o tema antes do primeiro paint, sem esperar app.js.
  (function () {
    var salvo = localStorage.getItem("tema");
    var tema = salvo || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", tema);
  })();
</script>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <p class="sidebar__brand">IGOR CARVALHO</p>
      <p class="sidebar__tagline">notas de engenharia · software &amp; IA</p>
      <div class="busca">
        <input type="search" id="busca-artigos" class="busca__campo" placeholder="Buscar artigos…" aria-label="Buscar artigos pelo título">
      </div>
      <nav>
        <!-- itens montados em runtime por assets/app.js a partir de articles/manifest.json -->
      </nav>
      <p class="busca__vazio" hidden>Nenhum artigo encontrado.</p>
      <div class="sidebar__footer">
        <button id="toggle-tema" class="theme-toggle" type="button">☾ tema escuro</button>
      </div>
    </aside>
    <main id="conteudo">
      <!-- conteúdo do artigo é injetado aqui via fetch (assets/app.js) -->
    </main>
  </div>
  <script src="./assets/app.js"></script>
</body>
</html>
