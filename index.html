<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igor Carvalho — Notas de Engenharia</title>
<meta name="description" content="Notas de engenharia sobre software e IA — artigos técnicos carregados sob demanda, zero build, GitHub Pages.">

<script>
  // Anti-flash: applies the theme before first paint, without waiting for app.js.
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="./assets/style.css?v=__SITE_VERSION__">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <p class="sidebar__brand">IGOR CARVALHO</p>
      <p class="sidebar__tagline">notas de engenharia · software &amp; IA</p>
      <div class="search">
        <input type="search" id="search-articles" class="search__field" placeholder="Buscar artigos…" aria-label="Buscar artigos pelo título">
      </div>
      <nav>
        <!-- itens montados em runtime por assets/app.js a partir de articles/manifest.json -->
      </nav>
      <p class="search__empty" hidden>Nenhum artigo encontrado.</p>
      <div class="sidebar__footer">
        <button id="toggle-theme" class="theme-toggle" type="button">☾ tema escuro</button>
      </div>
    </aside>
    <main id="content">
      <!-- conteúdo do artigo é injetado aqui via fetch (assets/app.js) -->
    </main>
  </div>
  <script>window.__SITE_VERSION__ = "__SITE_VERSION__";</script>
  <script src="./assets/app.js?v=__SITE_VERSION__"></script>
</body>
</html>
